<!-- MY TURN = the turn passes to ME: a greyed other person hands off, I point to myself -->
<!-- greyed second person (the previous turn-taker) at upper-right -->
<g stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M 430 196 L 470 196 L 462 256 L 438 256 Z" fill="#9aa7b3"/>
<circle id="h3" data-fig="fc" cx="450" cy="160" r="28" fill="#f1c9a5"/>

</g>
<!-- curved 'pass-to-me' arrow from the other person arcing down to MY chest (filled arrowhead) -->
<path d="M 440 256 Q 402 334 338 372" fill="none" stroke="#2b6fb0" stroke-width="13" stroke-linecap="round"/>
<g transform="translate(64.00 0) scale(0.750 1)"><polygon points="318,386 354,374 340,352" fill="#2b6fb0" stroke="#2b6fb0" stroke-width="2" stroke-linejoin="round"/></g>
<!-- pointing-to-self hand flat on my own chest = 'ME / my turn' -->
<g stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
<!-- forearm coming across to the chest -->
<line x1="196" y1="440" x2="248" y2="400" stroke="#f1c9a5" stroke-width="18"/>
<!-- hand pressed to the chest -->
<ellipse cx="262" cy="394" rx="24" ry="19" fill="#f1c9a5"/>
<!-- index finger jabbing toward self -->
<line x1="278" y1="386" x2="298" y2="372" stroke="#f1c9a5" stroke-width="12"/>
</g>


